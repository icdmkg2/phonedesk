# Publishes the website (site/) to GitHub Pages: https://icdmkg2.github.io/phonedesk/
# Needs Pages turned on once: Settings → Pages → Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: [site/**, CHANGELOG.md, docs/changelog/**, package.json, server/changelog.js, public/favicon.svg, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/build.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Checks a pull request builds: JavaScript syntax, the phone app (APK) and the Windows installer.
# The APK here is signed with a throwaway key; it's for testing only. The built files are kept as
# workflow artifacts for a few days.
name: Build check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: JavaScript syntax
        shell: bash
        run: |
          for f in server/*.js public/phone/*.js public/dashboard/*.js build/*.js site/*.js tools/*.js registry/*.js test/*.js; do
            [ -f "$f" ] || continue
            node --check "$f" || exit 1
          done
          node -e "require('./server/config'); require('./server/calendar'); require('./server/changelog'); require('./server/diagnostics')"

      - name: Updater and addon tests
        shell: bash
        run: |
          node test/updater.test.js
          node test/addons.test.js
          node test/widgets.test.js
          node test/lyrics.test.js
          node registry/check.js --offline

      - name: The Windows media bridge parses
        shell: pwsh
        run: |
          $t = $null; $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path server/bridge-win.ps1), [ref]$t, [ref]$e)
          $e | ForEach-Object { Write-Host "line $($_.Extent.StartLineNumber): $($_.Message)" }
          if ($e.Count) { throw "bridge-win.ps1 has $($e.Count) syntax error(s)" }
          # Windows PowerShell 5.1 runs it in the app, so check with that parser too
          powershell -NoProfile -Command "`$t=`$null;`$e=`$null;[void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path server/bridge-win.ps1),[ref]`$t,[ref]`$e); if (`$e.Count) { `$e | % { 'line ' + `$_.Extent.StartLineNumber + ': ' + `$_.Message }; exit 1 }"
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 could not parse bridge-win.ps1' }

      - name: Changelog has the current version
        shell: bash
        run: node build/release.js notes "$(node -p "require('./package.json').version")" > /dev/null

      - name: Build phone app
        shell: pwsh
        run: |
          $env:PHONEDESK_KEYSTORE = Join-Path $env:RUNNER_TEMP 'throwaway.keystore'
          powershell -ExecutionPolicy Bypass -File build\android.ps1
          if ($LASTEXITCODE -ne 0) { throw 'android build failed' }

      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: phonedesk-build
          path: |
            dist/PhoneDesk-Setup-*.exe
            public/phone/PhoneDesk.apk
          retention-days: 7

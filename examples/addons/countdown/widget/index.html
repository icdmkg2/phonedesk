<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown widget</title>
<style>
  :root { --bg: #0e0f12; --fg: #edeff3; --fg2: #a3a8b3; --fg3: #6b717d; --card: #1c1f25; --line: #2a2e36; --accent: #5b8cff; --radius: 14px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius); font: 500 14px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; padding: 8px; overflow: hidden; }
  b { font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.03em; line-height: 1; color: var(--accent); }
  span { color: var(--fg2); }
  small { color: var(--fg3); }
</style>
</head>
<body>
<b id="n">–</b><span id="u">days</span><small id="l"></small>
<script src="/addons/sdk.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function days() {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(PD.options.date || '').trim());
    if (!m) return null;
    var target = new Date(+m[1], +m[2] - 1, +m[3]), now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (isNaN(target)) return null;
    return Math.round((target - today) / 86400000);
  }
  function draw() {
    var d = days(), label = String(PD.options.label || '');
    $('l').textContent = label;
    if (d === null) { $('n').textContent = '?'; $('u').textContent = 'Set a date as YYYY-MM-DD'; return; }
    if (d === 0) { $('n').textContent = 'Today'; $('u').textContent = ''; return; }
    $('n').textContent = String(Math.abs(d));
    $('u').textContent = (Math.abs(d) === 1 ? 'day' : 'days') + (d < 0 ? ' ago' : ' to go');
  }
  function size() { var w = (PD.widget && PD.widget.w) || 300, h = (PD.widget && PD.widget.h) || 150; $('n').style.fontSize = Math.max(20, Math.min(h * .42, w * .28)) + 'px'; document.body.style.fontSize = Math.max(11, Math.min(h * .12, 17)) + 'px'; }
  PD.on('ready', function () { size(); draw(); });
  PD.on('resize', size);
  setInterval(draw, 60000);
  size(); draw();
})();
</script>
</body>
</html>

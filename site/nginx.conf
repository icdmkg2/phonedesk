server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 512;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Pages: always fresh (they name the current version).
  location ~ \.html$ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location = / { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; try_files /index.html =404; }

  # CSS/JS are versioned with ?v=, fonts and screenshots never change once released.
  location /assets/ { add_header Cache-Control "public, max-age=604800"; add_header X-Content-Type-Options nosniff always; }
  location /shots/ { add_header Cache-Control "public, max-age=2592000"; add_header X-Content-Type-Options nosniff always; }

  # /changelog -> /changelog.html
  location / { try_files $uri $uri.html $uri/ =404; }

  error_page 404 /index.html;
}
